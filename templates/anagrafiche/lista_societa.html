{% extends "base.html" %}

{% block title %}Società · GR Competition{% endblock %}

{% block content %}
  <h1 class="mb-4">Società</h1>

  <div class="box mb-4">
    <ul>
      {% for societa in societa_list %}
        <li>{{ societa.nome }} - {{ societa.citta }}</li>
      {% empty %}
        <li class="text-muted">Nessuna società presente.</li>
      {% endfor %}
    </ul>
  </div>

  <a class="btn" href="{% url 'crea_societa' %}">Nuova società</a>
{% endblock %}
